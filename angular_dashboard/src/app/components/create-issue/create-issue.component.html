<div class="ticket-wrapper">
  <div class="top-bar">
    <button class="back-button" (click)="router.navigate(['/dashboard'])">←</button>
    <h2>Create Ticket</h2>
  </div>

  <!-- Technician Help Section -->
  <div class="support-section">
    <button class="modern-button" (click)="toggleSupportDetails()">
      💬 Contact Support
    </button>

    <div *ngIf="showSupportDetails" class="support-details">
      <ul>
        <li><strong>Quota Issue:</strong> Visit Registrar Office</li>
        <li><strong>Payment Issue:</strong> Visit Treasurer Office</li>
        <li><strong>Network Issue:</strong> Contact IT Help Desk</li>
        <li><strong>Course Issue:</strong> Ask Department Coordinator</li>
      </ul>
    </div>
  </div>

  <form class="ticket-form" (ngSubmit)="handleSubmit()" enctype="multipart/form-data">
    <!-- Category -->
    <div class="form-group">
      <label for="category">Category:</label>
      <select [(ngModel)]="form.category" name="category" id="category" required>
        <option value="" disabled selected>Select a category</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Title -->
    <div class="form-group">
      <label for="title">Title*</label>
      <input
        type="text"
        [(ngModel)]="form.title"
        name="title"
        id="title"
        placeholder="Enter here..."
        required
      />
    </div>

    <!-- Description -->
     <label for="title">Description</label>
    <textarea
  [(ngModel)]="form.description"
  name="description"
  id="description"
  maxlength="120"
  placeholder="Let us know your thoughts..."
  required
  (input)="adjustTextareaHeight($event)"
></textarea>


    <!-- File Upload -->
    <div class="form-group">
      

      <button type="button" class="upload-button" (click)="fileInput.click()">
        📎 Upload Attachment
      </button>

      <input
        #fileInput
        type="file"
        (change)="onFileSelected($event)"
        multiple
        hidden
      />

      <!-- File Preview List -->
      <div class="file-preview" style="margin-top:12px;">
        <div *ngFor="let file of filePreviews; let i = index" class="file-thumb">
          <div class="file-icon">
            <img *ngIf="file.type.startsWith('image')" [src]="file.url" alt="preview" />
            <span *ngIf="!file.type.startsWith('image')">📄</span>
          </div>
          <div class="file-info">
            <span class="file-name">{{ file.name }}</span>
            <button type="button" class="file-remove" (click)="removeFile(i)">✖</button>
          </div>
        </div>
      </div>

      <!-- Upload Progress -->
      <div *ngIf="uploadProgress > 0" class="progress-bar">
        <div class="progress" [style.width.%]="uploadProgress"></div>
      </div>
      <p *ngIf="uploadSummary && !isUploading" class="upload-summary">{{ uploadSummary }}</p>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="router.navigate(['/dashboard'])">Cancel</button>
      <button type="submit" class="submit-btn">Create Ticket</button>
    </div>
  </form>
</div>
