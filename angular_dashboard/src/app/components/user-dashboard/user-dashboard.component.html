<div class="dashboard-wrapper">

  <!-- Hamburger Menu (visible on tablet/mobile) -->
  <div class="hamburger-menu" (click)="toggleSidebar()" [class.active]="isSidebarOpen">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Left Sidebar: Tasks Filters + Notes -->
  <aside class="sidebar" [class.active]="isSidebarOpen">
    <div class="profile-section">
      <div class="profile-icon"><img src="/Male.png" alt=""></div>
      <div class="profile-info">
        <h2 class="welcome-text">Welcome, {{ user?.username || 'User' }}!</h2>
      </div>
    </div>

    <div class="task-section">
      <div class="task-tabs">
        <button *ngFor="let status of statusTabs" (click)="onTabClick(status.key)"
          [class.active]="activeTab === status.key">
          {{ status.label }}
        </button>
      </div>

      <!-- ⬆ Create Issue Button -->
      <div class="create-issue-button-wrapper">
        <button class="create-issue-button-modern" (click)="createIssue()">
          <span class="icon">➕</span>
          <span class="text">Create Issue</span>
        </button>
      </div>

      <!-- ⬇ Notes Section -->
      <!-- <div class="notes-list-modern">
        <div class="note-card-modern green" *ngIf="totalPendingIssuesAllUsers >= 0">
          <h4>Total Pending Issues</h4>
          <p class="note-number">{{ totalPendingIssuesAllUsers }}</p>
        </div>
      </div> -->
    </div>
  </aside>


  <!-- Center Section: Issues -->
  <section class="center-section">
    <div 
      *ngFor="let issue of issues" 
      (click)="handleView(issue)"
      >
      <div class="task-item">

        <div class="task-main">
          <!-- Issue Title -->
          <div class="task-left">
            <div class="task-title">
              {{ issue.title }}
            </div>
          </div>

          <!-- Issue Status -->
          <div class="task-status">
            <span 
              class="status-badge" 
              [ngClass]="issue.status.toLowerCase()"
              [ngStyle]="{ 'background-color': getIssueStatusColor(issue.status), color: '#ffffff' }"
              >
              {{ issue.status }}
            </span>
          </div>

          <!-- Issue Category + Creation Date + Buttons -->
          <div class="task-right">
            <!-- Issue Category -->
            <div class="category-badge">
              {{ issue.category || 'Uncategorized' }}
            </div>
            <!-- Issue creation data -->
            <div class="task-created-date">
              <small>{{ issue.createdAt | date: 'short' }}</small>
            </div>

            <!-- Buttons -->
            <div class="comment_delete-buttons">

              <!-- Delete Button -->
              <div class="delete-slot" *ngIf="issue.status === 'PENDING'">
                <button class="delete-btn" (click)="deleteIssue(issue, $event)"> 
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

          </div>

        </div>

        <div class="task-description">
          <!-- {{ issue.description | slice:0:75 }} -->
          <span class="desc-text">{{ issue.description }}</span>
          <!-- <span *ngIf="issue.description?.length > 70">...</span> -->
        </div>
      </div>
    </div>
    <!-- </div> -->


    <!-- </div> -->
  </section>



  <!-- Create Issue Modal Slide-In -->
  <app-issue-form *ngIf="showCreateModal" (issueCreated)="closeCreateModal()" (cancel)="closeCreateModal()"
    class="slide-in-form">
  </app-issue-form>

  <!-- Overlay background -->
  <div *ngIf="showCreateModal" class="overlay-bg" (click)="closeCreateModal()"></div>

  <!-- Issue details modal -->
  <app-issue-view-modal-user *ngIf="selectedIssue" [issue]="selectedIssue" (close)="handleClose()">
  </app-issue-view-modal-user>
</div>
