<div class="dashboard-wrapper">
  <!-- Left Sidebar: Tasks Filters + Notes -->
  <aside class="sidebar">
    <div class="profile-section">
      <div class="profile-icon"><img src="/Male.png" alt=""></div>
      <div class="profile-info">
        <h2 class="welcome-text">Welcome, {{ user?.username || 'User' }}!</h2>
      </div>
    </div>

    <div class="task-section">
      <div class="task-tabs">
        <button *ngFor="let status of statusTabs" 
                (click)="onTabClick(status.key)"
                [class.active]="activeTab === status.key">
          {{ status.label }}
        </button>
      </div>

      <!-- ⬆ Create Issue Button -->
      <div class="create-issue-button-wrapper">
        <button class="create-issue-button-modern" (click)="createIssue()">
          <span class="icon">➕</span>
          <span class="text">Create Issue</span>
        </button>
      </div>

      <!-- ⬇ Notes Section -->
      <!-- <div class="notes-list-modern">
        <div class="note-card-modern green" *ngIf="totalPendingIssuesAllUsers >= 0">
          <h4>Total Pending Issues</h4>
          <p class="note-number">{{ totalPendingIssuesAllUsers }}</p>
        </div>
      </div> -->
    </div>
  </aside>

  <!-- Center Section: Issues -->
  <section class="center-section">
    <div class="task-list-section">
      <!-- Mobile: show issues for any selected tab (including ALL) -->
      <!-- Mobile View -->
<div *ngIf="isMobileView">
  <div *ngFor="let issue of issues" (click)="handleView(issue)">
    <div class="task-item">
      <div class="task-main">
        <div class="task-left">
          <!-- Show only the first 10 characters of the title in mobile view -->
          <div class="task-title">{{ issue.title | slice:0:10 }}</div>
        </div>
        <div class="task-right">
          <div class="category-badge"
               [ngStyle]="{ 'background-color': getCategoryColor(issue.category), color: '#fff' }">
            {{ issue.category || 'Uncategorized' }}
          </div>
          <!-- Hide created date on mobile -->
          <!-- <div class="task-created-date">
            <small>{{ issue.createdAt | date: 'short' }}</small>
          </div> -->
        </div>
      </div>
      <div class="task-description">
        {{ issue.description | slice:0:50 }}<span *ngIf="issue.description?.length > 70">...</span>
      </div>
    </div>
  </div>
</div>


      <!-- Desktop -->
      <div *ngIf="!isMobileView">
        <div *ngFor="let issue of issues" (click)="handleView(issue)">
          <div class="task-item">
            <div class="task-main">
              <div class="task-left">
                <div class="task-title">{{ issue.title }}</div>
              </div>
              <div class="task-right">
                <div class="category-badge"
                     [ngStyle]="{ 'background-color': getCategoryColor(issue.category), color: '#fff' }">
                  {{ issue.category || 'Uncategorized' }} 
                </div>
                <div class="task-created-date">
                  <small>{{ issue.createdAt | date: 'short' }}</small>
                </div>
              </div>
            </div>
            <div class="task-description">
              {{ issue.description | slice:0:50 }}<span *ngIf="issue.description?.length > 70">...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Create Issue Modal Slide-In -->
  <app-issue-form 
    *ngIf="showCreateModal" 
    (issueCreated)="closeCreateModal()" 
    (cancel)="closeCreateModal()" 
    class="slide-in-form">
  </app-issue-form>

  <!-- Overlay background -->
  <div *ngIf="showCreateModal" class="overlay-bg" (click)="closeCreateModal()"></div>

  <!-- Issue details modal -->
  <app-issue-view-modal-user
    *ngIf="selectedIssue"
    [issue]="selectedIssue"
    (close)="handleClose()">
  </app-issue-view-modal-user>
</div>
