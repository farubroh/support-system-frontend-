<!-- Top bar -->
<header class="topbar">
  <div class="left">
    <div class="board-title">Developer Dashboard</div>
  </div>

  <div class="search">
    <input
      type="search"
      placeholder="Search cards…"
      [value]="query()"
      (input)="query.set(($any($event.target)).value)"
    />
  </div>

  <div class="actions">
    <button class="icon" title="Notifications"><i class="fa-regular fa-bell"></i></button>
    <button class="icon" title="Messages"><i class="fa-regular fa-message"></i></button>
  </div>
</header>

<!-- Board -->
<main class="board" cdkDropListGroup>
  <section class="list" *ngFor="let list of filteredLists(); let i = index">
    <header class="list__header">
      <h3>{{ list.title }}</h3>
    </header>

    <!-- Each list has a unique id and is connected to others -->
    <div
      class="list__body"
      cdkDropList
      [id]="'list-'+i"
      [cdkDropListData]="list.cards"
      [cdkDropListConnectedTo]="connectedTo(i)"
      (cdkDropListDropped)="drop($event)"
    >
      <article
        class="card"
        *ngFor="let card of list.cards; trackBy: trackById"
        cdkDrag
        (click)="openCard(card)"
      >
        <div class="left">
          <span class="status" [class.done]="card.done">●</span>
        </div>

        <div class="content">
          <div class="title">
            <span *ngIf="card.done" class="check">✔</span>
            {{ card.title }}
            <span *ngIf="card.subtitle" class="tag">{{ card.subtitle }}</span>
          </div>
          <div class="meta" *ngIf="card.meta as m">
            <span *ngIf="m.views">👁 {{ m.views }}</span>
            <span *ngIf="m.comments">💬 {{ m.comments }}</span>
            <span *ngIf="m.attachments">📎 {{ m.attachments }}</span>
          </div>
        </div>

        <div class="right" (click)="$event.stopPropagation()">
          <button class="tiny" (click)="markDone(card)" title="Toggle done">✓</button>
          <button class="tiny danger" (click)="deleteCard(list, card)" title="Delete">✕</button>
        </div>
      </article>
    </div>

    <footer class="list__footer">
      <button class="add" (click)="addCard(list)">＋ Add a card</button>
    </footer>
  </section>

  <section class="list list--ghost">
    <button class="add-list" (click)="addList()">＋ Add another list</button>
  </section>
</main>

<!-- Details drawer -->
<aside class="details" [class.open]="selected() !== null" (click)="closeDetails()">
  <div class="details__panel" (click)="$event.stopPropagation()">
    <header class="details__header">
      <h3>{{ selected()?.title }}</h3>
      <button class="close" (click)="closeDetails()">✕</button>
    </header>

    <div class="details__body" *ngIf="selected() as s">
      <!-- Status -->
      <div class="row">
        <label>Status</label>
        <span class="status-badge"
              [class.open]="s.status === 'PENDING'"
              [class.in-progress]="s.status === 'INPROGRESS'"
              [class.closed]="s.status === 'COMPLETED'"
              [class.on-hold]="s.status === 'REJECTED'">
          {{ s.status }}
        </span>
      </div>

      <!-- Reporter -->
      <div class="row">
        <label>Reporter</label>
        <div>{{ s.subtitle || '—' }}</div>
      </div>

      <!-- Description -->
      <label class="muted">Description</label>
      <textarea
        rows="6"
        placeholder="Description…"
        [value]="description()"
        (input)="description.set(($any($event.target)).value)"
      ></textarea>

      <!-- Files -->
      <div class="files">
        <div class="files__header">
          <strong>Attachments</strong>
          <span *ngIf="loadingDetails">Loading…</span>
          <span *ngIf="!loadingDetails && selectedFiles.length === 0">No files</span>
        </div>

        <div class="files__list" *ngIf="selectedFiles.length > 0">
          <a
            class="file-chip"
            *ngFor="let f of selectedFiles"
            [href]="'http://localhost:8085/api/issues/files/' + (selectedIssuerUserId || 0) + '/' + f"
            target="_blank"
            rel="noopener"
          >📎 {{ f }}</a>
        </div>
      </div>

      <!-- Reasons (contextual) -->
      <ng-container [ngSwitch]="s.status">
        <!-- When already COMPLETED: show only completed reason -->
        <div class="row" *ngSwitchCase="'COMPLETED'">
          <label>Completed reason</label>
          <input type="text" [(ngModel)]="completeReason" placeholder="[optional]" />
        </div>

        <!-- When already REJECTED: show only rejection reason -->
        <div class="row" *ngSwitchCase="'REJECTED'">
          <label>Rejection reason</label>
          <input type="text" [(ngModel)]="rejectReason" placeholder="[optional]" />
        </div>

        <!-- When PENDING/INPROGRESS: allow both (fill whichever you’ll use) -->
        <ng-container *ngSwitchDefault>
          <div class="row">
            <label>Completed reason</label>
            <input type="text" [(ngModel)]="completeReason" placeholder="[optional]" />
          </div>
          <div class="row">
            <label>Rejection reason</label>
            <input type="text" [(ngModel)]="rejectReason" placeholder="[optional]" />
          </div>
        </ng-container>
      </ng-container>
    </div>

    <footer class="details__footer">
      <button class="primary" (click)="completeFromDetails()">Mark Completed</button>
      <button class="primary danger" (click)="rejectFromDetails()">Reject</button>
      <button class="primary muted" (click)="closeDetails()">Close</button>
    </footer>
  </div>
</aside>
